name: ERA5 mean wind plot - SE Asia

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First UTC day, YYYY-MM-DD"
        required: true
        default: "2015-08-30"
      end:
        description: "Last UTC day (inclusive), YYYY-MM-DD"
        required: true
        default: "2015-09-05"
      levels:
        description: "Comma-separated pressure levels in hPa"
        required: true
        default: "925,850"

permissions:
  contents: read

jobs:
  # Hourly ERA5 from ARCO-ERA5 (Google's public Zarr copy of the reanalysis):
  # no account, no request queue. Nothing is averaged here; the raw hours go to
  # the next job, which does the averaging.
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install xarray zarr fsspec aiohttp netCDF4 numpy

      - name: Download the hourly winds
        run: >-
          python scripts/download_era5_wind_arco.py
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --levels "${{ inputs.levels }}" --outdir raw

      - name: Upload the raw hourly files
        uses: actions/upload-artifact@v4
        with:
          name: era5-raw
          path: raw/
          retention-days: 14

  average-and-plot:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install cartopy (coastlines; optional)
        continue-on-error: true
        run: pip install cartopy

      - name: Fetch the daily files
        uses: actions/download-artifact@v4
        with:
          name: era5-raw
          path: raw

      - name: Average and plot
        run: >-
          python scripts/plot_era5_wind_mean.py
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --levels "${{ inputs.levels }}" --indir raw --outdir output

      - name: Upload plot and mean NetCDF
        uses: actions/upload-artifact@v4
        with:
          name: era5-mean-wind-${{ inputs.start }}_${{ inputs.end }}
          path: output/
          retention-days: 14
